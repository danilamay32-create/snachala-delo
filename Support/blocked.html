<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сначала дело</title>
<style>
@font-face{font-family:"Unbounded";src:url("Fonts/Unbounded.ttf")}
@font-face{font-family:"Onest";src:url("Fonts/Onest.ttf")}
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --surface2:#F6F7F4;
  --fg:#17201B; --fg2:#56605A; --fg3:#8A938D; --line:#D9DDD6;
  --lock:#D63A4A; --warn:#C77A0A;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121614; --surface:#1E2521; --surface2:#252D28;
  --fg:#EAF0EB; --fg2:#A6B0A9; --fg3:#717B74; --line:#313A34;
  --lock:#FF5E6C; --warn:#F0A53A; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
  font-family:"Onest",-apple-system,system-ui,sans-serif;padding:24px 16px}
.card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:22px;
  padding:32px 28px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
  box-shadow:0 30px 60px -30px rgba(0,0,0,.35)}
.lock{width:68px;height:68px;border-radius:19px;background:var(--lock);color:#fff;display:grid;place-items:center;
  animation:shake .5s}
.lock svg{width:32px;height:32px}
@keyframes shake{0%,100%{transform:none}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}}
h1{font-family:"Unbounded","Onest",system-ui,sans-serif;font-size:24px;line-height:1.1;margin:6px 0 0;letter-spacing:-.01em}
p{margin:0;color:var(--fg2);font-size:15px;line-height:1.45}
.site{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--fg3);overflow-wrap:anywhere}
ul{list-style:none;padding:0;margin:8px 0 0;width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
li{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:12px}
li span:last-child{color:var(--fg3);white-space:nowrap}
li.late span:last-child{color:var(--lock);font-weight:700}
.hint{font-size:13px;color:var(--fg3);margin-top:6px}
</style>
</head>
<body>
<main class="card">
  <div class="lock" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
    </svg>
  </div>
  <h1>Сначала дело</h1>
  <p id="lead">Этот сайт откроется, когда закроешь срочные задачи.</p>
  <div class="site" id="site"></div>
  <ul id="tasks"></ul>
  <div class="hint">Закрыть задачу — в «Сначала дело»: зажми кружок на 2 секунды.</div>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var site = q.get("site");
  if (site) document.getElementById("site").textContent = site;
  var tasks = q.getAll("t");
  var ul = document.getElementById("tasks");
  tasks.forEach(function (t) {
    var parts = t.split("|");
    var li = document.createElement("li");
    if (parts[2] === "late") li.className = "late";
    var a = document.createElement("span"); a.textContent = parts[0] || "";
    var b = document.createElement("span"); b.textContent = parts[1] || "";
    li.appendChild(a); li.appendChild(b); ul.appendChild(li);
  });
  if (tasks.length === 1) {
    document.getElementById("lead").textContent = "Этот сайт откроется, когда закроешь задачу:";
  } else if (tasks.length > 1) {
    document.getElementById("lead").textContent = "Этот сайт откроется, когда закроешь задачи:";
  }
})();
</script>
</body>
</html>
